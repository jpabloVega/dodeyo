version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: .
    binary: dodeyo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - arm64
      - amd64
      - "386"
    ldflags:
      - -X github.com/jpabloVega/dodeyo/cmd.Version={{.Version}}
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - ""

brews:
  - name: dodeyo
    repository:
      owner: jpabloVega
      name: homebrew-tap

    directory: FormulaDodeyo

    homepage: "https://github.com/jpabloVega/dodeyo"
    description: "Syosetsu novel to ereader"
    license: "MIT"

    install: |
      bin.install "tu-app"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-
    ---
    Released by [GoReleaser](https://github.com).
